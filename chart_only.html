<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2025 Mandarin Live Streaming Progress Chart</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 40px;
            min-height: 100vh;
            background: grey;
            color: white;
            font-family: 'Sora', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .chart-container {
            padding: 20px;
            box-sizing: border-box;
            width: 880px;
            height: 263px;
        }
        .progress-line {
            fill: none;
            stroke: #ffffff; /* green */
            stroke-width: 5;
        }
        .target-line {
            stroke: white;
            stroke-width: 2;
            stroke-dasharray: 4;
        }
        .line-label, .month-label {
            font-family: 'Sora', sans-serif;
            font-size: 1.4em;
            fill: white;
        }
        .month-label { text-anchor: start; }
        .chart-title {
            font-family: 'Sora', sans-serif;
            font-size: 1.5em;
            fill: #fff; /* white */
            text-anchor: start;
            /* font-weight: bold; */
        }

        /* new: current point dot */
        .current-dot {
            fill: #e74c3c;    /* red */
            stroke: white;
            stroke-width: 1;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <svg id="yearChart" width="880" height="223">
            <text id="chartTitle" class="chart-title"></text>
            <path id="progressLine" class="progress-line"></path>
            <!-- small red dot for current point (hidden until positioned) -->
            <circle id="currentDot" class="current-dot" r="4" visibility="hidden"></circle>
            <line id="targetLine" class="target-line"></line>
            <text id="goalText" class="line-label">goal</text>
            <text id="targetValue" class="line-label">1000 h</text>
            <text id="currentValue" class="line-label"></text>
            <g id="monthLabels"></g>
        </svg>
    </div>
    <script>
        const CHART_CONFIG = {
            left: 18,
            right: 42,  // Increased right margin
            top: 55,
            bottom: 20,
            width: 780,  // Matches container width
            height: 200
        };
        const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 
                        'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        async function loadChartData() {
            try {
                // fetch both CSVs in parallel
                const [respMain, respClass] = await Promise.all([
                    fetch('public/daily_summary.csv'),
                    fetch('public/classroom_collab_with_ben.csv')
                ]);
                if (!respMain.ok) throw new Error('Failed to fetch daily_summary.csv');
                if (!respClass.ok) throw new Error('Failed to fetch classroom_collab_with_ben.csv');
                const rows = (await respMain.text()).trim().split('\n').slice(1);
                const classRows = (await respClass.text()).trim().split('\n').slice(1);
                drawChart(processData(rows, classRows));
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        function processData(rows, classRows) {
            const weekMap = new Map();
            for (let i = 0; i < 53; i++) weekMap.set(i, 0);
            rows.forEach(row => {
                const [date, hours] = row.split(',');
                if (!date || !hours) return;
                const parsedDate = new Date(date);
                if (isNaN(parsedDate.getTime())) return;
                if (parsedDate.getFullYear() === 2024 && parsedDate.getMonth() === 11 && parsedDate.getDate() >= 30) {
                    const weekKey = 0;
                    weekMap.set(weekKey, weekMap.get(weekKey) + parseFloat(hours));
                    return;
                }
                if (parsedDate.getFullYear() !== 2025) return;
                const parsedHours = parseFloat(hours);
                if (isNaN(parsedHours)) return;
                const weekKey = getWeekNumber(parsedDate);
                if (weekKey >= 0 && weekKey < 53) {
                    weekMap.set(weekKey, weekMap.get(weekKey) + parsedHours);
                }
            });

            // Process classroom_collab_with_ben.csv rows (expected format: DD-MM-YYYY, url, number)
            if (Array.isArray(classRows)) {
                classRows.forEach(row => {
                    if (!row) return;
                    const cols = row.split(',');
                    const dateStr = (cols[0] || '').trim();
                    if (!dateStr) return;
                    // parse DD-MM-YYYY
                    const parts = dateStr.split('-');
                    if (parts.length !== 3) return;
                    const day = parseInt(parts[0], 10);
                    const month = parseInt(parts[1], 10) - 1; // zero-based
                    const year = parseInt(parts[2], 10);
                    if (isNaN(day) || isNaN(month) || isNaN(year)) return;
                    const classDate = new Date(year, month, day);
                    if (isNaN(classDate.getTime())) return;
                    // Only add classes for 2025 (as requested)
                    if (classDate.getFullYear() !== 2025) return;
                    const weekKey = getWeekNumber(classDate);
                    if (weekKey >= 0 && weekKey < 53) {
                        // add 1 hour for each class row
                        weekMap.set(weekKey, (weekMap.get(weekKey) || 0) + 1);
                    }
                });
            }
            let sum = 0;
            return Array.from({ length: 52 }, (_, i) => {
                sum += weekMap.get(i) || 0;
                return sum;
            });
        }

        function getWeekNumber(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            const firstWeekStart = new Date(2024, 11, 30);
            const diff = d.getTime() - firstWeekStart.getTime();
            return Math.floor(diff / (7 * 24 * 60 * 60 * 1000));
        }

        function drawChart(data) {
            const currentWeek = getWeekNumber(new Date());
            const currentData = data.slice(0, Math.min(currentWeek + 1, data.length));
            drawTitle();
            drawProgressLine(currentData);
            drawTargetLine();
            drawLabels(currentData);
            drawMonthLabels();
        }

        function drawTitle() {
            const title = document.getElementById('chartTitle');
            title.setAttribute('x', CHART_CONFIG.left);
            title.setAttribute('y', 25);
            title.textContent = '2025 Mandarin live streaming progress';
        }

        function drawProgressLine(data) {
            const points = data.map((value, index) => {
                const x = CHART_CONFIG.left + (index * ((CHART_CONFIG.width - CHART_CONFIG.left - CHART_CONFIG.right) / 51));
                const y = CHART_CONFIG.height - CHART_CONFIG.bottom - 
                         (value * (CHART_CONFIG.height - CHART_CONFIG.top - CHART_CONFIG.bottom) / 1000);
                return `${x},${y}`;
            });
            document.getElementById('progressLine')
                .setAttribute('d', `M ${points.join(' L ')}`);
        }

        function drawTargetLine() {
            const targetY = CHART_CONFIG.top;
            const line = document.getElementById('targetLine');
            line.setAttribute('x1', CHART_CONFIG.left + 53);
            line.setAttribute('x2', CHART_CONFIG.width - CHART_CONFIG.right);  // Removed the -20
            line.setAttribute('y1', targetY);
            line.setAttribute('y2', targetY);

            const labels = {
                goal: document.getElementById('goalText'),
                value: document.getElementById('targetValue')
            };
            labels.goal.setAttribute('x', CHART_CONFIG.left);
            labels.goal.setAttribute('y', targetY + 6);
            labels.value.setAttribute('x', CHART_CONFIG.width - CHART_CONFIG.right);  // Removed the -10
            labels.value.setAttribute('y', targetY + 6);
        }

        function drawLabels(data) {
            const currentTotal = data[data.length - 1] || 0;
            const label = document.getElementById('currentValue');
            const dot = document.getElementById('currentDot');

            if (currentTotal <= 0) {
                // hide label and dot when no data
                label.textContent = '';
                label.setAttribute('visibility', 'hidden');
                dot.setAttribute('visibility', 'hidden');
                return;
            }

            const x = CHART_CONFIG.left + ((data.length - 1) * ((CHART_CONFIG.width - CHART_CONFIG.left - CHART_CONFIG.right) / 51));
            const y = CHART_CONFIG.height - CHART_CONFIG.bottom -
                     (currentTotal * (CHART_CONFIG.height - CHART_CONFIG.top - CHART_CONFIG.bottom) / 1000);

            // Center the label horizontally on the point and place it below the point.
            const offsetBelow = 26; // pixels below the point
            const maxY = CHART_CONFIG.height - 2; // a little padding from bottom
            const labelY = Math.min(y + offsetBelow, maxY);

            label.setAttribute('text-anchor', 'middle');  // center text at x
            label.setAttribute('x', x);
            label.setAttribute('y', labelY);
            label.textContent = `${Math.round(currentTotal)}h`;
            label.setAttribute('visibility', 'visible');

            // Position and show the red dot exactly at the point (on top of the line)
            dot.setAttribute('cx', x);
            dot.setAttribute('cy', y);
            dot.setAttribute('visibility', 'visible');
        }

        function drawMonthLabels() {
            const container = document.getElementById('monthLabels');
            container.innerHTML = '';
            MONTHS.forEach((month, i) => {
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute('class', 'month-label');
                text.setAttribute('x', CHART_CONFIG.left + (i * (CHART_CONFIG.width - CHART_CONFIG.left - CHART_CONFIG.right) / 12));
                text.setAttribute('y', CHART_CONFIG.height+15);
                text.textContent = month;
                container.appendChild(text);
            });
        }

        document.addEventListener('DOMContentLoaded', loadChartData);
    </script>
</body>
</html>
